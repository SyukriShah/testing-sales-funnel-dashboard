server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  autoindex off;

  # The page is one file with inline script and style, and screenshots from its own folder. Nothing else may load.
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # tell search engines to stay away
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Optional interim password (before company sign-in is in place): create hosting/.htpasswd, mount it at
  # /etc/nginx/.htpasswd, then uncomment the next two lines.
  # auth_basic "IKHLAS Funnel Monitor";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  location = /index.html { add_header Cache-Control "no-store" always; }   # always show the latest results
  location /shots/ { add_header Cache-Control "private, max-age=3600" always; }
  location / { try_files $uri $uri/ =404; }
  location ~ /\. { deny all; }
}
